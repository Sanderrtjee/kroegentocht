name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Wekelijks, zodat een nieuw gepubliceerde kwetsbaarheid in een bestaande
  # dependency ook zonder commit wordt opgemerkt.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: kroegentocht_test
          POSTGRES_USER: kroeg_test
          POSTGRES_PASSWORD: kroeg_test_wachtwoord
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U kroeg_test -d kroegentocht_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      # De auditstap staat vooraan en breekt de build bij een bekende
      # kwetsbaarheid met ernst high of hoger in de productieafhankelijkheden.
      # Devdependencies staan er niet in: die komen niet in het image terecht.
      - name: Audit van productieafhankelijkheden
        run: npm run audit:ci

      # Devdependencies wel controleren, maar zonder de build te breken. Een
      # kwetsbaarheid in een buildtool is een aandachtspunt, geen productierisico.
      - name: Audit van alle afhankelijkheden (informatief)
        run: npm audit --audit-level=moderate || true

      - name: Bouwen
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unittests
        run: npm run test:unit

      - name: Integratietests
        run: npm run test:integration
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '55432'

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Alleen bouwen, niet pushen: dit is een zelf gehoste applicatie zonder
      # registry. De stap bestaat om te merken dat het image nog bouwt.
      - name: Api-image bouwen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/api.Dockerfile
          push: false
          load: true
          tags: kroegentocht-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Backup-image bouwen
        uses: docker/build-push-action@v6
        with:
          context: ops/backup
          file: ops/backup/Dockerfile
          push: false
          tags: kroegentocht-backup:ci

      - name: Controleren dat de api als non-root draait
        run: |
          user="$(docker image inspect kroegentocht-api:ci --format '{{.Config.User}}')"
          echo "image draait als: ${user}"
          test "${user}" = "node"

  addon-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # De Home Assistant-add-on. De Supervisor geeft BUILD_FROM mee op basis van
      # build.yaml; hier doen we dat met de hand zodat het buiten Home Assistant
      # ook te bouwen is.
      - name: Add-onimage bouwen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:bookworm
          push: false
          load: true
          tags: kroegentocht-addon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # De controlescripts gaan via stdin de container in, niet als argument van
      # bash -c. Dat scheelt een laag aanhalingstekens: een patroon met een
      # carriage return erin overleeft dat nesten niet.
      - name: Controleren dat de s6-diensten in het image kloppen
        run: |
          cat > check-s6.sh <<'SCRIPT'
          set -eu
          # Een script met CRLF-regeleindes maakt de container onstartbaar: de
          # kernel zoekt dan een interpreter met een carriage return aan het eind
          # van de naam en meldt "no such file or directory" op een pad dat wel
          # bestaat. Op een Windows-werkplek is dat een reeel risico.
          cr="$(printf '\r')"
          for f in /etc/s6-overlay/scripts/init-config \
                   /etc/s6-overlay/scripts/init-postgres \
                   /etc/s6-overlay/s6-rc.d/postgres/run \
                   /etc/s6-overlay/s6-rc.d/api/run; do
            test -x "$f" || { echo "FOUT: niet uitvoerbaar: $f"; exit 1; }
            if grep -q "$cr" "$f"; then echo "FOUT: CRLF-regeleindes in $f"; exit 1; fi
            echo "  ok  $f"
          done
          for f in /etc/s6-overlay/s6-rc.d/user/contents.d/init-config \
                   /etc/s6-overlay/s6-rc.d/user/contents.d/init-postgres \
                   /etc/s6-overlay/s6-rc.d/user/contents.d/postgres \
                   /etc/s6-overlay/s6-rc.d/user/contents.d/api \
                   /etc/s6-overlay/s6-rc.d/postgres/down-signal; do
            test -f "$f" || { echo "FOUT: ontbreekt: $f"; exit 1; }
            echo "  ok  $f"
          done
          # SIGINT en niet SIGTERM: bij Postgres is SIGTERM een smart shutdown die
          # wacht op de laatste client, en dan haalt de add-on de stoptimeout niet.
          test "$(cat /etc/s6-overlay/s6-rc.d/postgres/down-signal)" = SIGINT
          echo "s6-diensten in orde"
          SCRIPT
          docker run --rm -i --entrypoint /bin/bash kroegentocht-addon:ci < check-s6.sh

      - name: Controleren dat Postgres, PostGIS en Node in het image zitten
        run: |
          cat > check-image.sh <<'SCRIPT'
          set -eu
          postgres --version
          node --version
          ls /usr/share/postgresql/17/extension/postgis.control > /dev/null
          test -f /app/api/dist/index.js
          test -f /app/web/dist/index.html
          ls /app/db/migrations/*.sql > /dev/null
          echo "image compleet"
          SCRIPT
          docker run --rm -i --entrypoint /bin/bash kroegentocht-addon:ci < check-image.sh

      # De echte test: de add-on starten en de hele keten laten draaien, dus
      # init-config, initdb, Postgres, de migraties en de api. Slaagt /readyz met
      # publicView op ok, dan werkt ook de read-only databaserol.
      #
      # Er is hier geen Supervisor, dus init-config valt terug op
      # /data/options.json. Dat pad bestaat op een echte machine ook (de
      # Supervisor schrijft dat bestand), dus we testen geen fictieve variant.
      #
      # registration_enabled staat op false, en daar wordt op gecontroleerd. Dat
      # is geen willekeurige keuze: false is de waarde die stil verkeerd kan gaan
      # als je opties met 'jq // empty' uitleest, want in jq is false ook falsy.
      # Deze test valt om zodra iemand die fout opnieuw maakt.
      - name: Add-on starten en /readyz controleren
        run: |
          mkdir -p addon-data
          cat > addon-data/options.json <<'JSON'
          {
            "invite_code": "ci-uitnodigingscode",
            "registration_enabled": false,
            "public_base_url": "http://127.0.0.1:8099",
            "contact_email": "ci@voorbeeld.nl",
            "cookie_secure": true,
            "log_level": "info",
            "tile_cache_ttl_days": 30,
            "tile_upstream_template": "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            "nominatim_base_url": "https://nominatim.openstreetmap.org"
          }
          JSON
          docker run -d --name kt-addon \
            -v "${PWD}/addon-data:/data" \
            -p 127.0.0.1:8099:3000 \
            kroegentocht-addon:ci

          ok=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8099/readyz -o readyz.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done

          echo '--- logboek van de add-on ---'
          docker logs kt-addon 2>&1 | tail -80

          if [ "${ok}" != 1 ]; then
            echo 'FOUT: /readyz antwoordde niet binnen 180 seconden'
            exit 1
          fi

          echo '--- readyz ---'
          cat readyz.json
          grep -q '"database":"ok"' readyz.json
          grep -q '"publicView":"ok"' readyz.json

          echo '--- opties zijn echt aangekomen ---'
          curl -fsS http://127.0.0.1:8099/api/auth/registration-status -o regstatus.json
          cat regstatus.json
          if ! grep -q '"enabled":false' regstatus.json; then
            echo 'FOUT: registration_enabled stond op false maar de app rapporteert iets anders.'
            echo 'Waarschijnlijk worden de opties verkeerd uitgelezen.'
            exit 1
          fi

          echo 'add-on is opgekomen, beide databasepools werken en de opties komen door'

      - name: Add-on opruimen
        if: always()
        run: docker rm -f kt-addon 2>/dev/null || true
